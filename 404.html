<script>

  items.forEach(item => {
    item.addEventListener('mouseenter', () => {

      if (art) {
        nameDisplay.textContent = art;
      } else {
        nameDisplay.textContent = "PAGE INCONNUE";
      }
    });
  });
</script>

<script>
  // aggrandit les tables cliquables quand on passe dessus //
  const allDivs = document.querySelectorAll('div');
  const exceptions = ['grid', 'empty', 'line', 'plan','index','text-bloc', 'title-bloc', 'scroll-container','intro','intro_image','intro_texte','footer','cartographie','desktop','mobile']; // classes à exclure des effets globaux

  allDivs.forEach(div => {
    div.addEventListener('mouseenter', () => {
      // Récupérer les classes "actives" : toutes sauf celles exclues
      const activeClasses = [...div.classList].filter(cls => !exceptions.includes(cls));
      if (activeClasses.length === 0) return; // rien à faire si aucune classe active

      // Construire un sélecteur CSS combiné pour cette combinaison exacte
      const selector = activeClasses.map(cls => `.${cls}`).join('');

      // Sélectionner tous les éléments qui ont exactement cette combinaison
      const sameComboElements = document.querySelectorAll(selector);

      sameComboElements.forEach(el => el.style.transform = 'scale(1.5)');
    });

    div.addEventListener('mouseleave', () => {
      const activeClasses = [...div.classList].filter(cls => !exceptions.includes(cls));
      if (activeClasses.length === 0) return;

      const selector = activeClasses.map(cls => `.${cls}`).join('');
      const sameComboElements = document.querySelectorAll(selector);

      sameComboElements.forEach(el => el.style.transform = 'scale(1)');
    });
  });
</script>

<script>
  //effet de vague //
const grids = document.querySelectorAll('.grid');
const influenceRadius = 300; //distance influence en px//

document.addEventListener('mousemove', (e) => {
  grids.forEach(grid => {

    // Lire les anciens niveaux
    let oldRot = parseFloat(grid.dataset.rot || 0);
    let oldOpacity = parseFloat(grid.dataset.opacity || 100);

    const rect = grid.getBoundingClientRect();
    const gridX = rect.left + rect.width / 2;
    const gridY = rect.top + rect.height / 2;

    const distance = Math.hypot(e.clientX - gridX, e.clientY - gridY);

    if (distance < influenceRadius) {
      const proximity = 1 - (distance / influenceRadius);

      const newRot = proximity * 10;      // roration 0 → 20
      const newOpacity = 100 - 25 * proximity; // scale 100 → 50

      // CUMUL MAXIMA : ne jamais diminuer instantanément
      const appliedRot = Math.max(oldRot, newRot);
      const appliedOpacity = Math.min(oldOpacity, newOpacity);

      // enregistrer l’état
      grid.dataset.rot = appliedRot;
      grid.dataset.opacity = appliedOpacity;

      // effet instantané
      grid.classList.remove('relax');
      grid.style.transform = `rotate(${appliedRot}deg) scale(${1 - appliedRot/40})`;
      grid.style.opacity = `${appliedOpacity}%`;

    } else {
      // retour progressif
      grid.classList.add('relax');

      // interpolate vers l'état normal
      grid.dataset.rot = 0;
      grid.dataset.opacity = 100;

      grid.style.transform = `rotate(0deg) scale(1)`;
      grid.style.opacity = `100%`;
    }
  });
});
</script>
